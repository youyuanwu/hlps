[workspace]
members = ["crates/*", "samples/c-guest/host", "samples/c-guest/native", "samples/benchmark"]
exclude = ["target/postgres-experiment/sources/hyperlight-unikraft"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false
license = "MIT"

[workspace.dependencies]
anyhow = "1"
libc = "0.2"
hyperlight-common = { version = "=0.19.0", default-features = false, features = ["std"] }
vercode = "=0.7.0"
hyperlight-process = { path = "crates/hyperlight-process" }

[profile.dev]
debug = 0
