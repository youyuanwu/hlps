[package]
name = "hyperlight-benchmarks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
default-run = "hyperlight-benchmark"

[dependencies]
anyhow.workspace = true
hyperlight-process.workspace = true
hyperlight-host = { version = "=0.19.0", default-features = false, features = ["kvm"] }

[build-dependencies]
anyhow.workspace = true
cc = "1"

[dev-dependencies]
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }

[[bin]]
name = "hyperlight-benchmark"
path = "src/main.rs"

[[bin]]
name = "hyperlight-benchmark-runner"
path = "src/bin/runner.rs"

[[bench]]
name = "modes"
harness = false
